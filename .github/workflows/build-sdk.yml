name: Build libPXREARobotSDK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y build-essential cmake git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone and build SDK (x86_64)
        run: |
          mkdir -p tmp
          cd tmp
          git clone https://github.com/XR-Robotics/XRoboToolkit-PC-Service.git
          cd XRoboToolkit-PC-Service/RoboticsService/PXREARobotSDK
          bash build.sh

      - name: Verify glibc version
        run: |
          ldd --version | head -1
          objdump -T tmp/XRoboToolkit-PC-Service/RoboticsService/PXREARobotSDK/build/libPXREARobotSDK.so | grep GLIBC | sed 's/.*GLIBC_//; s/ .*//' | sort -Vu

      - name: Collect artifacts
        run: |
          mkdir -p output/amd64/lib output/amd64/include/nlohmann
          cp tmp/XRoboToolkit-PC-Service/RoboticsService/PXREARobotSDK/build/libPXREARobotSDK.so output/amd64/lib/
          cp tmp/XRoboToolkit-PC-Service/RoboticsService/PXREARobotSDK/PXREARobotSDK.h output/amd64/include/
          cp -r tmp/XRoboToolkit-PC-Service/RoboticsService/PXREARobotSDK/nlohmann/* output/amd64/include/nlohmann/

      - name: Upload amd64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: libPXREARobotSDK-amd64
          path: output/amd64/

  build-aarch64:
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:22.04
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y build-essential cmake git ca-certificates g++-12
          update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100

      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone and build SDK (aarch64)
        run: |
          mkdir -p tmp
          cd tmp
          git clone -b orin https://github.com/XR-Robotics/XRoboToolkit-PC-Service.git
          cd XRoboToolkit-PC-Service/RoboticsService/PXREARobotSDK
          bash build.sh

      - name: Verify glibc version
        run: |
          ldd --version | head -1
          objdump -T tmp/XRoboToolkit-PC-Service/RoboticsService/PXREARobotSDK/build/libPXREARobotSDK.so | grep GLIBC | sed 's/.*GLIBC_//; s/ .*//' | sort -Vu

      - name: Collect artifacts
        run: |
          mkdir -p output/aarch64/lib output/aarch64/include/nlohmann
          cp tmp/XRoboToolkit-PC-Service/RoboticsService/PXREARobotSDK/build/libPXREARobotSDK.so output/aarch64/lib/
          cp tmp/XRoboToolkit-PC-Service/RoboticsService/PXREARobotSDK/PXREARobotSDK.h output/aarch64/include/
          cp -r tmp/XRoboToolkit-PC-Service/RoboticsService/PXREARobotSDK/nlohmann/* output/aarch64/include/nlohmann/

      - name: Upload aarch64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: libPXREARobotSDK-aarch64
          path: output/aarch64/

  release:
    needs: [build-amd64, build-aarch64]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create combined archive
        run: |
          cd artifacts
          tar czf ../libPXREARobotSDK-all.tar.gz .

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: libPXREARobotSDK-all-platforms
          path: libPXREARobotSDK-all.tar.gz
